<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>girlfriend on the moon – official site</title>
  <meta name="description" content="Listen, tour dates, merch, and more.">
  <!-- Open Graph for social sharing -->
  <meta property="og:title" content="Band Name">
  <meta property="og:description" content="Official website of Band Name">
  <meta property="og:image" content="/assets/img/hero.jpg">
  <link rel="stylesheet" href="/assets/css/styles.css">
</head>
<body>
  <header class="hero">
    <h1>Band Name</h1>
    <p>Live. Loud. Together.</p>
  </header>

  <!-- Spotify embed -->
  <section id="music">
    <h2>Listen Now</h2>
    <iframe src="https://open.spotify.com/embed/album/ALBUM_ID"
            width="100%" height="80" frameborder="0"
            allowtransparency="true" allow="encrypted-media"></iframe>
  </section>

  <!-- Tour dates (simple static table) -->
  <section id="tour">
    <h2>Upcoming Shows</h2>
    <table>
      <tr><th>Date</th><th>City</th><th>Venue</th></tr>
      <tr><td>2026‑04‑15</td><td>Los Angeles, CA</td><td>The Roxy</td></tr>
      <tr><td>2026‑05‑02</td><td>New York, NY</td><td>Bowery Ballroom</td></tr>
    </table>
  </section>

  <!-- Merch button (links to external store) -->
  <section id="merch">
    <h2>Shop</h2>
    <a href="https://yourstore.myshopify.com" class="btn">Visit Merch Store</a>
  </section>

  <footer>
    <nav>
      <a href="https://instagram.com/yourband">Instagram</a>
      <a href="https://youtube.com/yourband">YouTube</a>
      <a href="mailto:booking@yourband.com">Booking</a>
    </nav>
  </footer>

  <script src="/assets/js/main.js"></script>
</body>
</html>
